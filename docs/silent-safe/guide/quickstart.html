<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SilentSafe · 快速开始</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/logo.jpg" />
  <link rel="stylesheet" href="../../../assets/font-awesome/css/all.min.css" />
  <link rel="stylesheet" href="../../docs.css" />
  <script src="../../docs-i18n.js"></script>
</head>
<body>
  <header class="doc-nav">
    <div class="doc-nav-inner">
      <a class="doc-brand" href="../../../index.html">
        <img src="../../../assets/logo.jpg" alt="SilentStudio" />
        <span class="doc-brand-name">SilentSafe<em>Security</em></span>
      </a>
      <nav class="doc-nav-links">
        <a href="../../../index.html" data-i18n="nav_home">首页</a>
        <a href="../index.html" data-i18n="nav_docs_home">文档首页</a>

        <div class="lang-select" id="langSelect">
        <button class="lang-btn" id="langBtn" type="button" title="Language"><i class="fas fa-globe"></i><span id="langCurrent">简中</span><i class="fas fa-chevron-down"></i></button>
        <div class="lang-menu">
        <div class="lang-search"><i class="fas fa-search"></i><input type="text" id="langSearch" placeholder="搜索语言…" autocomplete="off" /></div>
        <div class="lang-list" id="langList"></div>
        </div>
        </div>
        <button class="btn-theme" id="themeBtn" type="button" title="切换主题"><i class="fas fa-moon" id="themeIcon"></i></button>
        <a class="btn-github" href="https://github.com/Silent-Studio-CN" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
      </nav>
    </div>
  </header>

  <div id="transBanner"></div>

  <main class="doc-wrap">
    <nav class="doc-crumbs">
      <a href="../../index.html" data-i18n="crumb_docs">Docs</a><i class="fas fa-chevron-right"></i>
      <a href="../index.html">SilentSafe</a><i class="fas fa-chevron-right"></i>
      <a href="quickstart.html" data-i18n="crumb_guide">Guide</a><i class="fas fa-chevron-right"></i><span>Quickstart</span>
    </nav>

    <div class="doc-hero">
      <span class="doc-eyebrow">Guide</span>
      <h1 class="doc-title"><span data-i18n="quick_title_suffix">快速开始</span> · SilentSafe</h1>
    </div>

    <div class="doc-content">
      <div class="callout callout-wip">
        <i class="fas fa-hammer" style="margin-right:8px;"></i>
        <strong>我们还在努力开发</strong>
        <p style="margin:10px 0 0;">SilentSafe 目前仍在开发阶段，快速开始指南将在正式发布后提供。欢迎前往 GitHub 仓库关注最新进展。</p>
      </div>
      <div class="repo-banner">
        <p>想第一时间了解开发进度、参与讨论或获取发布通知？关注 <strong>SilentSafe</strong> 的 GitHub 仓库。</p>
        <a class="btn-primary" href="https://github.com/Silent-Studio-CN" target="_blank" rel="noopener"><i class="fab fa-github"></i> <span data-i18n="btn_gh_repo">前往 GitHub 仓库</span></a>
      </div>
    </div>
  </main>

  <footer class="doc-footer">
    <p><a href="../../../index.html">SilentStudio</a> · © <span id="year"></span> Silent-Studio-CN · <span data-i18n="footer_page">文档页</span></p>
  </footer>
  <script>
    (function () {
      var html = document.documentElement;
      var theme = 'dark';
      try { theme = localStorage.getItem('ss_theme') || 'dark'; } catch (e) {}
      html.setAttribute('data-theme', theme);
      document.getElementById('year').textContent = new Date().getFullYear();
      var btn = document.getElementById('themeBtn');
      var icon = document.getElementById('themeIcon');
      function sync() { if (icon) icon.className = html.getAttribute('data-theme') === 'dark' ? 'fas fa-sun' : 'fas fa-moon'; }
      sync();
      if (btn) btn.addEventListener('click', function () {
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        try { localStorage.setItem('ss_theme', html.getAttribute('data-theme')); } catch (e) {}
        sync();
      });
    })();
  </script>

</body>
</html>
