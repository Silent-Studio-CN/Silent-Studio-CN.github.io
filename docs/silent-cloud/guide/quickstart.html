<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SilentCloud · 快速开始</title>
  <link rel="icon" type="image/jpeg" href="../../../assets/logo.jpg" />
  <link rel="stylesheet" href="../../../assets/font-awesome/css/all.min.css" />
  <link rel="stylesheet" href="../../docs.css" />
  <script src="../../docs.js"></script>
</head>
<body>
  <header class="doc-nav">
    <div class="doc-nav-inner">
      <a class="doc-brand" href="../../../index.html">
        <img src="../../../assets/logo.jpg" alt="SilentStudio" />
        <span class="doc-brand-name">SilentCloud<em>Cloud</em></span>
      </a>
      <nav class="doc-nav-links">
        <a href="../../../index.html">首页</a>
        <a href="../index.html">文档首页</a>
        <button class="btn-theme" id="themeBtn" type="button" title="切换主题"><i class="fas fa-moon" id="themeIcon"></i></button>
        <a class="btn-github" href="https://github.com/Silent-Studio-CN" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
      </nav>
    </div>
  </header>

  <main class="doc-wrap">
    <nav class="doc-crumbs">
      <a href="../../index.html">Docs</a><i class="fas fa-chevron-right"></i>
      <a href="../index.html">SilentCloud</a><i class="fas fa-chevron-right"></i>
      <a href="quickstart.html">Guide</a><i class="fas fa-chevron-right"></i><span>Quickstart</span>
    </nav>

    <div class="doc-hero">
      <span class="doc-eyebrow">Guide</span>
      <h1 class="doc-title">快速开始 · SilentCloud</h1>
    </div>

    <div class="doc-content">
      <h2>快速开始</h2>
      <p>SilentCloud 是 SilentStudio 的 Web 云服务，无需本地部署，访问官网注册账号即可开通使用。</p>
      <div class="repo-banner">
        <p>前往 <strong>SilentCloud</strong> 官网开始使用。</p>
        <a class="btn-primary" href="https://xx.com" target="_blank" rel="noopener"><i class="fas fa-globe"></i> 前往官网</a>
      </div>
      <div class="callout callout-warn">更多使用指南即将上线，敬请期待。</div>
    </div>
  </main>

  <footer class="doc-footer">
    <p><a href="../../../index.html">SilentStudio</a> · © <span id="year"></span> Silent-Studio-CN · 文档页</p>
  </footer>
  <script>
    (function () {
      var html = document.documentElement;
      var theme = 'dark';
      try { theme = localStorage.getItem('ss_theme') || 'dark'; } catch (e) {}
      html.setAttribute('data-theme', theme);
      document.getElementById('year').textContent = new Date().getFullYear();
      var btn = document.getElementById('themeBtn');
      var icon = document.getElementById('themeIcon');
      function sync() { if (icon) icon.className = html.getAttribute('data-theme') === 'dark' ? 'fas fa-sun' : 'fas fa-moon'; }
      sync();
      if (btn) btn.addEventListener('click', function () {
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        try { localStorage.setItem('ss_theme', html.getAttribute('data-theme')); } catch (e) {}
        sync();
      });
    })();
  </script>

</body>
</html>
