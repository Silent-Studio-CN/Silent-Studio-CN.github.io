<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文档搜索 · SilentStudio</title>
  <link rel="icon" type="image/jpeg" href="../assets/logo.jpg" />
  <link rel="stylesheet" href="../assets/font-awesome/css/all.min.css" />
  <link rel="stylesheet" href="docs.css" />
  <script src="docs-i18n.js"></script>
  <style>
    .search-hero { text-align: center; padding: 40px 0 12px; }
    .search-hero h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; }
    .search-hero p { margin-top: 10px; color: var(--text-dim); font-size: 0.95rem; }
    .search-box {
      max-width: 640px;
      margin: 30px auto 0;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 6px 8px 6px 18px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .search-box:focus-within {
      border-color: rgba(124, 140, 255, 0.6);
      box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.15);
    }
    .search-box i { color: var(--text-faint); font-size: 1rem; }
    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      padding: 10px 0;
    }
    .search-box input::placeholder { color: var(--text-faint); }
    .search-box .clear-btn {
      background: none; border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .search-box .clear-btn:hover { color: var(--text); }
    .search-meta { max-width: 860px; margin: 26px auto 0; font-size: 0.8rem; color: var(--text-faint); }
    .search-results { max-width: 860px; margin: 14px auto 60px; display: flex; flex-direction: column; gap: 12px; }
    .result-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 22px;
      transition: border-color 0.25s, transform 0.25s, background 0.25s;
    }
    .result-card:hover {
      border-color: rgba(124, 140, 255, 0.45);
      transform: translateX(4px);
      background: rgba(124, 140, 255, 0.05);
    }
    .result-crumb { font-family: var(--mono); font-size: 0.7rem; color: var(--accent-2); margin-bottom: 6px; }
    .result-title { font-size: 1.02rem; font-weight: 700; }
    .result-title i { font-size: 0.78rem; color: var(--text-faint); margin-left: 6px; }
    .result-desc { margin-top: 6px; font-size: 0.86rem; color: var(--text-dim); }
    .result-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .result-tags span {
      font-family: var(--mono);
      font-size: 0.64rem;
      color: var(--text-faint);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 2px 8px;
    }
    .no-result { text-align: center; color: var(--text-faint); padding: 40px 0; }
    .repo-line { text-align: center; margin: 10px 0 60px; }
    .repo-line a { color: var(--accent-2); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="doc-nav">
    <div class="doc-nav-inner">
      <a class="doc-brand" href="../index.html">
        <img src="../assets/logo.jpg" alt="SilentStudio" />
        <span class="doc-brand-name">文档搜索<em>Docs</em></span>
      </a>
      <nav class="doc-nav-links">
        <a href="../index.html" data-i18n="nav_home">首页</a>

        <div class="lang-select" id="langSelect">
        <button class="lang-btn" id="langBtn" type="button" title="Language"><i class="fas fa-globe"></i><span id="langCurrent">简中</span><i class="fas fa-chevron-down"></i></button>
        <div class="lang-menu">
        <div class="lang-search"><i class="fas fa-search"></i><input type="text" id="langSearch" placeholder="搜索语言…" autocomplete="off" /></div>
        <div class="lang-list" id="langList"></div>
        </div>
        </div>
        <button class="btn-theme" id="themeBtn" type="button" title="切换主题"><i class="fas fa-moon" id="themeIcon"></i></button>
        <a class="btn-github" href="https://github.com/Silent-Studio-CN" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
      </nav>
    </div>
  </header>

  <div id="transBanner"></div>

  <main class="doc-wrap">
    <div class="search-hero">
      <h1>文档搜索</h1>
      <p>搜索 SilentStudio 产品文档与快速开始指南</p>
    </div>

    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="输入关键词，如：SilentSafe / 快速开始 / 部署…" autocomplete="off" />
      <button class="clear-btn" id="clearBtn" type="button" title="清空"><i class="fas fa-times"></i></button>
    </div>

    <div class="search-meta" id="searchMeta"></div>
    <div class="search-results" id="searchResults"></div>

    <p class="repo-line"><a href="https://github.com/Silent-Studio-CN/Silent-Studio-CN.github.io" target="_blank" rel="noopener">本项目仓库 ›</a></p>
  </main>

  <footer class="doc-footer">
    <p><a href="../index.html">SilentStudio</a> · © <span id="year"></span> Silent-Studio-CN · <span data-i18n="footer_search">文档搜索</span></p>
  </footer>

  <script>
    (function () {
      'use strict';
      var html = document.documentElement;
      var theme = 'dark';
      try { theme = localStorage.getItem('ss_theme') || 'dark'; } catch (e) {}
      html.setAttribute('data-theme', theme);
      document.getElementById('year').textContent = new Date().getFullYear();
      var btn = document.getElementById('themeBtn');
      var icon = document.getElementById('themeIcon');
      function sync() { if (icon) icon.className = html.getAttribute('data-theme') === 'dark' ? 'fas fa-sun' : 'fas fa-moon'; }
      sync();
      if (btn) btn.addEventListener('click', function () {
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        try { localStorage.setItem('ss_theme', html.getAttribute('data-theme')); } catch (e) {}
        sync();
      });

      var INDEX = [
        { crumb: 'SilentSafe · Docs', title: 'SilentSafe 文档', desc: '智能安全防护工具：威胁扫描、行为监控、启发式分析与隔离区。', link: 'silent-safe/', tags: ['Security', '防护'] },
        { crumb: 'SilentSafe · Guide', title: 'SilentSafe 快速开始', desc: '环境要求、安装依赖与启动扫描，几分钟跑起来。', link: 'silent-safe/guide/quickstart.html', tags: ['Guide', '安装'] },
        { crumb: 'SilentGameEngine · Docs', title: 'SilentGameEngine 文档', desc: '跨语言游戏引擎：渲染、物理、音频与场景模块。', link: 'silent-game-engine/', tags: ['Engine', '渲染'] },
        { crumb: 'SilentGameEngine · Guide', title: 'SilentGameEngine 快速开始', desc: '创建引擎实例、添加场景并启动主循环。', link: 'silent-game-engine/guide/quickstart.html', tags: ['Guide', 'OpenGL'] },
        { crumb: 'SilentCloud · Docs', title: 'SilentCloud 文档', desc: 'Web 云服务：官网、服务托管、可视化工作流与 API 密钥管理。', link: 'silent-cloud/', tags: ['Cloud', '服务'] },
        { crumb: 'SilentCloud · Guide', title: 'SilentCloud 快速开始', desc: '访问官网注册账号即可开通使用，无需本地部署。', link: 'silent-cloud/guide/quickstart.html', tags: ['Guide', 'Cloud'] },
        { crumb: 'SilentStudioWebSite · Docs', title: 'SilentStudioWebSite 文档', desc: '多语言官网 + 可视化工作流编辑器 + 3D 建模流。', link: 'silentstudio-website/', tags: ['Website', '工作流'] },
        { crumb: 'SilentStudioWebSite · Guide', title: 'SilentStudioWebSite 快速开始', desc: '启动后端并打开编辑器体验 3D 建模流。', link: 'silentstudio-website/guide/quickstart.html', tags: ['Guide', '3D'] },
        { crumb: 'SlimeMold · Docs', title: 'SlimeMold 文档', desc: '黏菌启发的轻量级路径规划库：BFS 气味扩散 + 加权概率爬行，零依赖。', link: 'slime-mold/', tags: ['Pathfinding', 'Python'] },
        { crumb: 'SlimeMold · Guide', title: 'SlimeMold 快速开始', desc: '安装、30 秒上手、双策略与可视化窗口。', link: 'slime-mold/guide/quickstart.html', tags: ['Guide', '安装'] },
        { crumb: 'IntTest · Docs', title: 'IntTest 文档', desc: '网络连通性与速度测试工具：测速、实时监控、Ping 与网络信息。', link: 'inttest/', tags: ['Network', '测试'] },
        { crumb: 'IntTest · Guide', title: 'IntTest 快速开始', desc: '已发布 v2.2.0：下载对应架构的 exe 直接运行。', link: 'inttest/guide/quickstart.html', tags: ['Guide', '下载'] }
      ];

      // 远程补充索引：index 仓库 WebSite/docs.jsonl（每行一条 JSON），失败忽略
      function loadJsonl() {
        var sources = [
          'https://cdn.jsdelivr.net/gh/Silent-Studio-CN/index@main/WebSite/docs.jsonl',
          'https://raw.githubusercontent.com/Silent-Studio-CN/index/main/WebSite/docs.jsonl'
        ];
        var tryNext = function (i) {
          if (i >= sources.length) { render(input.value); return; }
          fetch(sources[i], { cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
            .then(function (text) {
              text.split('\n').forEach(function (line) {
                line = line.trim();
                if (!line) return;
                try {
                  var it = JSON.parse(line);
                  if (it && it.title) {
                    INDEX.push({
                      crumb: it.crumb || (it.tags ? (it.tags[0] || 'Docs') + ' · Docs' : 'Docs · Docs'),
                      title: it.title,
                      desc: it.desc || it.description || '',
                      link: it.link || it.url || '',
                      tags: it.tags || []
                    });
                  }
                } catch (e) {}
              });
              render(input.value);
            })
            .catch(function () { tryNext(i + 1); });
        };
        tryNext(0);
      }

      var input = document.getElementById('searchInput');
      var clearBtn = document.getElementById('clearBtn');
      var meta = document.getElementById('searchMeta');
      var results = document.getElementById('searchResults');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function render(q) {
        q = (q || '').trim().toLowerCase();
        var list = INDEX.filter(function (it) {
          if (!q) return true;
          var hay = (it.title + ' ' + it.desc + ' ' + it.tags.join(' ') + ' ' + it.crumb).toLowerCase();
          return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
        });
        meta.textContent = q
          ? '找到 ' + list.length + ' 条与 "' + input.value.trim() + '" 相关的结果'
          : '共 ' + INDEX.length + ' 篇文档';
        if (list.length === 0) {
          results.innerHTML = '<div class="no-result"><i class="fas fa-search" style="font-size:1.6rem;display:block;margin-bottom:12px;opacity:.5"></i>没有找到相关文档，换个关键词试试</div>';
          return;
        }
        results.innerHTML = list.map(function (it) {
          var tags = it.tags.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
          return '<a class="result-card" href="' + it.link + '">' +
            '<div class="result-crumb">' + esc(it.crumb) + '</div>' +
            '<div class="result-title">' + esc(it.title) + ' <i class="fas fa-arrow-right"></i></div>' +
            '<div class="result-desc">' + esc(it.desc) + '</div>' +
            '<div class="result-tags">' + tags + '</div>' +
          '</a>';
        }).join('');
      }

      input.addEventListener('input', function () { render(input.value); });
      clearBtn.addEventListener('click', function () {
        input.value = '';
        render('');
        input.focus();
      });
      render('');
      loadJsonl();
    })();
  </script>
</body>
</html>
